<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Square background with rounded corners (same frame as the atem logo) -->
  <rect x="0" y="0" width="200" height="200" rx="24" ry="24" fill="url(#bgGrad)" />

  <!-- Motion lines: the email on its way -->
  <line x1="30" y1="66" x2="52" y2="66" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.55" />
  <line x1="22" y1="86" x2="52" y2="86" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.75" />
  <line x1="34" y1="106" x2="52" y2="106" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.55" />

  <!-- Envelope -->
  <rect x="62" y="48" width="112" height="78" rx="10" ry="10" fill="#ffffff" />
  <!-- Envelope flap -->
  <polyline points="68,56 118,94 168,56" stroke="#0a58ca" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Divider line -->
  <line x1="30" y1="148" x2="170" y2="148" stroke="#ffffff" stroke-width="1" opacity="0.25" />

  <!-- EDM wordmark -->
  <text
    x="100"
    y="178"
    text-anchor="middle"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="36"
    font-weight="700"
    letter-spacing="6"
    fill="#ffffff"
  >EDM</text>
</svg>
